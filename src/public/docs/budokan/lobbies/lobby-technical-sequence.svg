<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 950" width="752" height="950" role="img" aria-label="Lobby technical sequence: approve, signed slip, create_lobby in one transaction, play, claim or refund_unwon">
<title>Lobby technical sequence: approve, signed slip, create_lobby in one transaction, play, claim or refund_unwon</title>
<style>
text{fill:#18181b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:12.5px;font-weight:600}
.lb{font-size:12px}
.sm{font-size:11px;fill:#5f5f69}
.cp{font-size:11px;fill:#5f5f69;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ph{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#5f5f69}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.box{fill:#ffffff;stroke-width:1.5}
.player{stroke:#2563eb} .budokan{stroke:#0d9488} .new{stroke:#d97706} .game{stroke:#7c3aed}
.off{stroke:#5f5f69;stroke-dasharray:4 3}
.arr{stroke:#5f5f69;stroke-width:1.3;fill:none}
.money-arr{stroke:#d97706;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:4 3}
.life{stroke:#e4e4e7;stroke-width:1;stroke-dasharray:3 3}
</style>
<rect x="0.5" y="0.5" width="751" height="949" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
<g transform="translate(16,16)">
<defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#5f5f69"/></marker><marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#d97706"/></marker></defs><rect class="box player" x="4" y="8" width="98" height="40" rx="7"/><text class="t" x="53" y="26" text-anchor="middle" style="font-size:12px">Game Account</text><text class="sm" x="53" y="41" text-anchor="middle">×N players</text><rect class="box off" x="106" y="8" width="98" height="40" rx="7"/><text class="t" x="155" y="26" text-anchor="middle" style="font-size:12px">Matchmaker</text><text class="sm" x="155" y="41" text-anchor="middle">budokan-bots</text><rect class="box new" x="208" y="8" width="98" height="40" rx="7" style="stroke-width:2.2"/><text class="t" x="257" y="26" text-anchor="middle" style="font-size:12px">LobbyEscrow</text><text class="sm" x="257" y="41" text-anchor="middle">new contract</text><rect class="box " x="310" y="8" width="98" height="40" rx="7" style="stroke:#5f5f69"/><text class="t" x="359" y="26" text-anchor="middle" style="font-size:12px">USDC</text><text class="sm" x="359" y="41" text-anchor="middle">token</text><rect class="box budokan" x="412" y="8" width="98" height="40" rx="7"/><text class="t" x="461" y="26" text-anchor="middle" style="font-size:12px">Validator</text><text class="sm" x="461" y="41" text-anchor="middle">Merkle allowlist</text><rect class="box budokan" x="514" y="8" width="98" height="40" rx="7"/><text class="t" x="563" y="26" text-anchor="middle" style="font-size:12px">Budokan</text><text class="sm" x="563" y="41" text-anchor="middle">tournament</text><rect class="box game" x="616" y="8" width="98" height="40" rx="7"/><text class="t" x="665" y="26" text-anchor="middle" style="font-size:12px">Game</text><text class="sm" x="665" y="41" text-anchor="middle">Death Mountain</text><path class="life" d="M53 48V914M155 48V914M257 48V914M359 48V914M461 48V914M563 48V914M665 48V914"/><text class="ph halo" x="8" y="74">ONE-TIME SETUP</text><path class="arr" d="M53 100H357" marker-end="url(#d)"/><text class="cp halo" x="64" y="94">approve(LobbyEscrow, cap) · owner wallet</text><path class="arr" d="M257 120h22v16h-20" marker-end="url(#d)"/><text class="cp halo" x="287" y="134">set_tier(tier_id, tier) · owner only</text><text class="ph halo" x="8" y="172">QUEUE · OFF-CHAIN</text><path class="arr dash" d="M53 196H153" marker-end="url(#d)"/><text class="lb halo" x="62" y="190">signed slip</text><text class="cp halo" x="165" y="200">SNIP-9 outside execution of join(tier_id) · escrow-only · once · 6h</text><path class="arr" d="M155 212h22v16h-20" marker-end="url(#d)"/><text class="lb halo" x="185" y="226">enough queued: pick a group, keep it secret</text><text class="ph halo" x="8" y="264" style="fill:#92400e">CREATE_LOBBY · ONE TRANSACTION · ALL OR NOTHING</text><path class="arr" d="M155 288H255" marker-end="url(#d)"/><text class="cp halo" x="162" y="282">create_lobby</text><text class="cp halo" x="266" y="292">(tier_id, intents) · matchmaker only</text><rect x="22" y="302" width="390" height="98" rx="6" style="fill:none;stroke:#d97706;stroke-dasharray:3 3"/><text class="ph halo" x="30" y="317" style="fill:#92400e">FOR EACH INTENT</text><path class="arr" d="M257 336H55" marker-end="url(#d)"/><text class="cp halo" x="68" y="330">execute_from_outside_v2</text><path class="arr" d="M53 362H255" marker-end="url(#d)"/><text class="cp halo" x="68" y="356">join(tier_id) callback</text><path class="money-arr" d="M359 388H259" marker-end="url(#dm)"/><text class="cp halo" x="266" y="382">transfer_from · buy-in</text><path class="arr" d="M257 424H459" marker-end="url(#d)"/><text class="cp halo" x="266" y="418">merkle_validator.create_tree(root)</text><path class="arr" d="M257 454H561" marker-end="url(#d)"/><text class="cp halo" x="266" y="448">budokan.create_tournament(…)</text><text class="sm halo" x="266" y="470">entry_requirement = merkle allowlist</text><text class="sm halo" x="266" y="485">max_entries = seats × attempts · no entry fee</text><path class="money-arr" d="M257 512H357" marker-end="url(#dm)"/><text class="cp halo" x="266" y="506">transfer · protocol fee → Budokan fee recipient</text><path class="money-arr" d="M257 542H561" marker-end="url(#dm)"/><text class="cp halo" x="266" y="536">approve + add_prize(pool − fee, position 1)</text><text class="cp halo" x="266" y="564">emits LobbyCreated(tournament_id, tier, amount, attempts,</text><text class="cp halo" x="266" y="579">  players, protocol_fee, prize_id, prize)</text><text class="sm halo" x="266" y="598">any failure → whole transaction reverts, nobody is charged</text><text class="ph halo" x="8" y="630">PLAY · EACH PLAYER, EACH ATTEMPT</text><path class="arr dash" d="M53 654H255" marker-end="url(#d)"/><text class="cp halo" x="68" y="648">entry_qualification(players, attempts, seat) · view</text><path class="arr" d="M53 682H561" marker-end="url(#d)"/><text class="cp halo" x="68" y="676">enter_tournament(id, qualification proof) · player pays ~1¢ gas</text><path class="arr" d="M563 708H463" marker-end="url(#d)"/><text class="sm halo" x="469" y="702">seated? within attempts?</text><path class="arr" d="M563 734H663" marker-end="url(#d)"/><text class="sm halo" x="571" y="728">mint game token</text><path class="arr" d="M53 760H663" marker-end="url(#d)"/><text class="lb halo" x="68" y="754">play the attempt · the game reports the score</text><text class="ph halo" x="8" y="796">AFTER THE TOURNAMENT IS FINALIZED</text><path class="money-arr dash" d="M563 820H55" marker-end="url(#dm)"/><text class="cp halo" x="68" y="814">claim_reward · best run takes the prize (pool − protocol fee)</text><text class="sm halo" x="68" y="842">or, if nobody scored:</text><path class="money-arr dash" d="M563 864H259" marker-end="url(#dm)"/><text class="lb halo" x="266" y="858">Budokan returns the prize to LobbyEscrow</text><path class="money-arr dash" d="M257 890H55" marker-end="url(#dm)"/><text class="cp halo" x="68" y="884">refund_unwon(tournament_id, players)</text><text class="sm halo" x="68" y="908">anyone can call · once · even split to each player · the protocol fee is not refunded</text>
</g>
</svg>
