<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 488" width="752" height="488" role="img" aria-label="Lobby component view: Game Account, Matchmaker server, LobbyEscrow, Budokan bracket, Game">
<title>Lobby component view: Game Account, Matchmaker server, LobbyEscrow, Budokan bracket, Game</title>
<style>
text{fill:#18181b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:12.5px;font-weight:600}
.lb{font-size:12px}
.sm{font-size:11px;fill:#5f5f69}
.cp{font-size:11px;fill:#5f5f69;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ph{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#5f5f69}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.box{fill:#ffffff;stroke-width:1.5}
.player{stroke:#2563eb} .budokan{stroke:#0d9488} .new{stroke:#d97706} .game{stroke:#7c3aed}
.off{stroke:#5f5f69;stroke-dasharray:4 3}
.arr{stroke:#5f5f69;stroke-width:1.3;fill:none}
.money-arr{stroke:#d97706;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:4 3}
.life{stroke:#e4e4e7;stroke-width:1;stroke-dasharray:3 3}
</style>
<rect x="0.5" y="0.5" width="751" height="487" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
<g transform="translate(16,16)">

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#5f5f69"/></marker>
    <marker id="cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#d97706"/></marker>
  </defs>
  <!-- player -->
  <rect class="box player" x="20" y="20" width="190" height="376" rx="10"/>
  <text class="t" x="115" y="48" text-anchor="middle">Player's Game Account</text>
  <text class="sm" x="115" y="68" text-anchor="middle">one per player</text>
  <text class="sm" x="115" y="96" text-anchor="middle">session key signs in-game,</text>
  <text class="sm" x="115" y="112" text-anchor="middle">no wallet prompts</text>
  <text class="sm" x="115" y="140" text-anchor="middle">owner wallet approved a</text>
  <text class="sm" x="115" y="156" text-anchor="middle">USDC spending cap once ①</text>
  <!-- right column -->
  <rect class="box off" x="500" y="20" width="200" height="64" rx="8"/>
  <text class="t" x="516" y="44">Matchmaker server</text>
  <text class="sm" x="516" y="62">budokan-bots · off-chain</text>
  <text class="sm" x="516" y="76">groups players in secret</text>

  <rect class="box new" x="500" y="124" width="200" height="64" rx="8" style="stroke-width:2.2"/>
  <text class="t" x="516" y="148">LobbyEscrow <tspan style="fill:#d97706;font-size:11px">NEW</tspan></text>
  <text class="sm" x="516" y="166">collects buy-ins, pays entries</text>
  <text class="cp" x="516" y="180">create_lobby</text>

  <rect class="box budokan" x="500" y="228" width="200" height="64" rx="8"/>
  <text class="t" x="516" y="252">Budokan bracket</text>
  <text class="sm" x="516" y="270">runs matches, holds the pool</text>
  <text class="sm" x="516" y="284">already deployed</text>

  <rect class="box game" x="500" y="332" width="200" height="64" rx="8"/>
  <text class="t" x="516" y="356">Game (Death Mountain)</text>
  <text class="sm" x="516" y="374">one game per attempt</text>
  <text class="sm" x="516" y="388">already deployed</text>

  <!-- horizontal: player <-> right column -->
  <path class="arr dash" d="M212 56H498" marker-end="url(#c)"/>
  <text class="lb" x="224" y="49">② signs a slip: "let the escrow join me"</text>
  <text class="cp" x="224" y="72">off-chain · join(tier) · 6h · once</text>

  <path class="money-arr" d="M212 146H498" marker-end="url(#cm)"/>
  <text class="lb" x="224" y="139">④ buy-in pulled, using that slip</text>
  <path class="arr dash" d="M498 176H214" marker-end="url(#c)"/>
  <text class="lb" x="224" y="169">⑥ refund passed back, if no winner</text>

  <path class="arr" d="M212 250H498" marker-end="url(#c)"/>
  <text class="lb" x="224" y="243">⑤ enters each match, no prompt</text>
  <path class="money-arr dash" d="M498 280H214" marker-end="url(#cm)"/>
  <text class="lb" x="224" y="273">⑥ champion claims the pool</text>

  <path class="arr" d="M212 364H498" marker-end="url(#c)"/>
  <text class="lb" x="224" y="357">⑤ plays, up to 5 attempts per match</text>

  <!-- vertical: down the right column -->
  <path class="arr" d="M524 84V122" marker-end="url(#c)"/>
  <text class="lb" x="534" y="108">③ hands over a full lobby</text>
  <path class="money-arr" d="M524 188V226" marker-end="url(#cm)"/>
  <text class="lb" x="534" y="212">④ opens bracket, pays entries</text>
  <path class="arr" d="M524 292V330" marker-end="url(#c)"/>
  <text class="lb" x="534" y="316">⑤ starts a game per attempt</text>
  <g class="legend-svg"><path class="money-arr" d="M20 422H48"/><text class="sm" x="56" y="426">money moves</text><path class="arr" d="M160 422H188"/><text class="sm" x="196" y="426">an action, no money</text><path class="arr dash" d="M330 422H358"/><text class="sm" x="366" y="426">off-chain, or only in some cases</text><rect class="box player" x="20" y="435" width="16" height="11" rx="3"/><text class="sm" x="42" y="445">Player</text><rect class="box new" x="90" y="435" width="16" height="11" rx="3"/><text class="sm" x="112" y="445">New: LobbyEscrow</text><rect class="box budokan" x="225" y="435" width="16" height="11" rx="3"/><text class="sm" x="247" y="445">Budokan stack (deployed)</text><rect class="box game" x="400" y="435" width="16" height="11" rx="3"/><text class="sm" x="422" y="445">Game</text><rect class="box off" x="465" y="435" width="16" height="11" rx="3"/><text class="sm" x="487" y="445">Off-chain</text></g>

</g>
</svg>
