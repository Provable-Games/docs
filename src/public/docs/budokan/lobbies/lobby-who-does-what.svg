<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 672" width="752" height="672" role="img" aria-label="Lobby component view: Game Account, Matchmaker, LobbyEscrow, Merkle validator, Budokan, Game">
<title>Lobby component view: Game Account, Matchmaker, LobbyEscrow, Merkle validator, Budokan, Game</title>
<style>
text{fill:#18181b;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:12.5px;font-weight:600}
.lb{font-size:12px}
.sm{font-size:11px;fill:#5f5f69}
.cp{font-size:11px;fill:#5f5f69;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ph{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#5f5f69}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}
.box{fill:#ffffff;stroke-width:1.5}
.player{stroke:#2563eb} .budokan{stroke:#0d9488} .new{stroke:#d97706} .game{stroke:#7c3aed}
.off{stroke:#5f5f69;stroke-dasharray:4 3}
.arr{stroke:#5f5f69;stroke-width:1.3;fill:none}
.money-arr{stroke:#d97706;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:4 3}
.life{stroke:#e4e4e7;stroke-width:1;stroke-dasharray:3 3}
</style>
<rect x="0.5" y="0.5" width="751" height="671" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
<g transform="translate(16,16)">
<defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#5f5f69"/></marker><marker id="cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:#d97706"/></marker></defs><rect class="box player" x="20" y="20" width="180" height="554" rx="10"/><text class="t" x="110" y="48" text-anchor="middle">Your Game Account</text><text class="sm" x="110" y="66" text-anchor="middle">one per player</text><text class="sm" x="110" y="98" text-anchor="middle">session key signs the</text><text class="sm" x="110" y="114" text-anchor="middle">slip for one tier ②</text><text class="sm" x="110" y="142" text-anchor="middle">owner wallet approved</text><text class="sm" x="110" y="158" text-anchor="middle">a USDC cap once ①</text><text class="sm" x="110" y="186" text-anchor="middle">enters and plays its</text><text class="sm" x="110" y="202" text-anchor="middle">own attempts ⑤</text><text class="sm" x="110" y="230" text-anchor="middle">pays ~1¢ gas per entry</text><rect class="box off" x="470" y="20" width="230" height="78" rx="8"/><text class="t" x="486" y="44">Matchmaker</text><text class="sm" x="486" y="62">budokan-bots · off-chain</text><text class="sm" x="486" y="76">queue per tier, groups in secret</text><text class="sm" x="486" y="90">can't spend without your slip</text><rect class="box new" x="470" y="142" width="230" height="78" rx="8" style="stroke-width:2.2"/><text class="t" x="486" y="166">LobbyEscrow <tspan style="fill:#d97706;font-size:11px">NEW</tspan></text><text class="sm" x="486" y="184">takes buy-ins, sets up the table,</text><text class="sm" x="486" y="198">splits an unwon prize back</text><text class="cp" x="486" y="212">create_lobby · refund_unwon</text><rect x="458" y="264" width="254" height="206" rx="12" style="fill:none;stroke:#0d9488;stroke-width:1;stroke-dasharray:2 3"/><text class="ph" x="692" y="283" text-anchor="end">ALREADY DEPLOYED</text><rect class="box budokan" x="470" y="292" width="230" height="62" rx="8"/><text class="t" x="486" y="314">Merkle validator</text><text class="sm" x="486" y="332">lets in only seated players,</text><text class="sm" x="486" y="346">each within their attempts</text><rect class="box budokan" x="470" y="396" width="230" height="62" rx="8"/><text class="t" x="486" y="418">Budokan</text><text class="sm" x="486" y="436">runs the one tournament:</text><text class="sm" x="486" y="450">entries, leaderboard, prize</text><rect class="box game" x="470" y="512" width="230" height="62" rx="8"/><text class="t" x="486" y="534">Game (Death Mountain)</text><text class="sm" x="486" y="552">a game token per attempt,</text><text class="sm" x="486" y="566">reports each score</text><path class="arr" d="M488 98V140" marker-end="url(#c)"/><text class="lb" x="498" y="124">③ create_lobby with the slips</text><path class="money-arr" d="M488 220V290" marker-end="url(#cm)"/><text class="lb" x="498" y="250">④ allowlist · tournament · prize</text><path class="arr" d="M488 396V356" marker-end="url(#c)"/><text class="lb" x="498" y="380">⑤ checks each entry</text><path class="arr" d="M488 458V510" marker-end="url(#c)"/><text class="lb" x="498" y="496">⑤ starts a game per attempt</text><path class="arr dash" d="M202 56H468" marker-end="url(#c)"/><text class="lb" x="214" y="49">② signs a slip: "join me to this tier"</text><text class="cp" x="214" y="72">off-chain · escrow-only · once · 6h</text><path class="money-arr" d="M202 166H468" marker-end="url(#cm)"/><text class="lb" x="214" y="159">④ buy-in taken, using that slip</text><path class="money-arr dash" d="M468 202H204" marker-end="url(#cm)"/><text class="lb" x="214" y="195">if nobody scores: an even share back</text><path class="arr" d="M202 414H468" marker-end="url(#c)"/><text class="lb" x="214" y="407">⑤ enters each attempt with a proof</text><path class="money-arr dash" d="M468 444H204" marker-end="url(#cm)"/><text class="lb" x="214" y="437">⑥ best run claims the prize</text><path class="arr" d="M202 543H468" marker-end="url(#c)"/><text class="lb" x="214" y="536">⑤ plays each attempt</text><g class="legend-svg"><path class="money-arr" d="M20 606H48"/><text class="sm" x="56" y="610">money moves</text><path class="arr" d="M160 606H188"/><text class="sm" x="196" y="610">an action, no money</text><path class="arr dash" d="M330 606H358"/><text class="sm" x="366" y="610">off-chain, or only in some cases</text><rect class="box player" x="20" y="619" width="16" height="11" rx="3"/><text class="sm" x="42" y="629">Player</text><rect class="box new" x="90" y="619" width="16" height="11" rx="3"/><text class="sm" x="112" y="629">New: LobbyEscrow</text><rect class="box budokan" x="225" y="619" width="16" height="11" rx="3"/><text class="sm" x="247" y="629">Budokan stack (deployed)</text><rect class="box game" x="400" y="619" width="16" height="11" rx="3"/><text class="sm" x="422" y="629">Game</text><rect class="box off" x="465" y="619" width="16" height="11" rx="3"/><text class="sm" x="487" y="629">Off-chain</text></g>
</g>
</svg>
